name: Build and Release

# MOS Hub installs plugins by downloading a Debian package (.deb) matching
# the selected architecture from this repo's latest GitHub release -- it
# does NOT run `go build` or fetch a raw binary itself. See
# https://github.com/ich777/mos-backup for the reference packaging layout
# this workflow follows. Release tags must be bare version numbers
# (e.g. "0.1.0"), not "v0.1.0".

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  frontend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build plugin settings page
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: page/dist/motd

  build:
    needs: [version, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o motd .

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: page/dist/motd

      - name: Assemble Debian package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          PKG_DIR="pkg"

          mkdir -p "${PKG_DIR}/usr/bin/plugins"
          mkdir -p "${PKG_DIR}/var/www/mos-plugins/motd"
          mkdir -p "${PKG_DIR}/DEBIAN"

          cp motd "${PKG_DIR}/usr/bin/plugins/motd"
          chmod +x "${PKG_DIR}/usr/bin/plugins/motd"

          cp -R page/dist/motd/* "${PKG_DIR}/var/www/mos-plugins/motd/"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: mos-motd
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: websterwh
          Description: Message-of-the-day system summary for MOS
          EOF

          cat > "${PKG_DIR}/DEBIAN/postinst" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x "${PKG_DIR}/DEBIAN/postinst"

          cat > "${PKG_DIR}/DEBIAN/postrm" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x "${PKG_DIR}/DEBIAN/postrm"

          DEB_FILE="mos-motd_${VERSION}_${ARCH}.deb"
          dpkg-deb --build --root-owner-group "${PKG_DIR}" "${DEB_FILE}"
          md5sum "${DEB_FILE}" | awk '{print $1}' > "${DEB_FILE}.md5"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: mos-motd_*.deb*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
